# CI/CD for PlayCount.
#
#   pull request  → test
#   push to main  → test → deploy to GitHub Pages → smoke-test the live site
#   weekly        → smoke-test the live site (catches iTunes/Spotify API changes)
#
# The site is only ever published by the deploy job, after the tests pass on that exact commit.
# Requires Settings → Pages → Source: "GitHub Actions".
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site (only the game, stamped with this commit)
        run: |
          mkdir _site
          sed 's|<meta name="build" content="dev">|<meta name="build" content="${{ github.sha }}">|' index.html > _site/index.html
          grep -q 'content="${{ github.sha }}"' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Google Chrome is installed (preinstalled on GitHub's Ubuntu runners)
        run: google-chrome --version
      - run: npm run smoke
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD: ${{ github.sha }}

  monitor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Google Chrome is installed (preinstalled on GitHub's Ubuntu runners)
        run: google-chrome --version
      - run: npm run smoke
